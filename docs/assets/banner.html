<!doctype html>
<!--
  Source of the README banner (banner-light.png, banner-dark.png). Rendered
  at 1280x320 with a transparent page background; see docs/assets/README.md.
  Open with ?theme=dark for the dark variant.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>InsustyReviewBench banner</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Inter:wght@500&display=block"
    />
    <style>
      :root {
        /* Insusty brand kit, "Sunset" direction. */
        --plum: #4a1f42;
        --plum-deep: #3a1834;
        --coral: #ff6b4a;
        --coral-deep: #c23f26;
        --amber: #ffa940;
        --peach: #fff3ea;
        --peach-deep: #ffe3d6;
        --ink-soft: #7a5a50;
        --line: #f0ddd0;

        --bg: var(--peach);
        --border: var(--line);
        --name: var(--plum);
        --accent: var(--coral-deep);
        --text: var(--ink-soft);
      }
      :root.dark {
        --bg: var(--plum);
        --border: var(--plum-deep);
        --name: #ffffff;
        --accent: var(--coral);
        --text: rgba(255, 227, 214, 0.8);
      }
      html,
      body {
        margin: 0;
        background: transparent;
      }
      .banner {
        box-sizing: border-box;
        width: 1280px;
        height: 320px;
        border-radius: 36px;
        border: 2px solid var(--border);
        background: var(--bg);
        display: flex;
        align-items: center;
        gap: 52px;
        padding: 0 72px;
        overflow: hidden;
        position: relative;
      }
      .banner::after {
        /* The brand's coral-to-amber energy, as a thin band, not a hero gradient. */
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 10px;
        background: linear-gradient(90deg, var(--coral), var(--amber));
      }
      img {
        width: 216px;
        height: 216px;
        flex-shrink: 0;
      }
      .by {
        font: 600 26px/1 "Poppins", sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 14px;
      }
      h1 {
        font: 800 80px/1.05 "Poppins", sans-serif;
        letter-spacing: -0.01em;
        color: var(--name);
        margin: 0 0 18px;
      }
      h1 span {
        color: var(--accent);
      }
      p {
        font: 500 30px/1.3 "Inter", sans-serif;
        color: var(--text);
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <img src="insusty-logo.png" alt="" />
      <div>
        <div class="by">by Insusty</div>
        <h1>InsustyReview<span>Bench</span></h1>
        <p>The open benchmark for Insusty Privacy Coach</p>
      </div>
    </div>
    <script>
      if (new URLSearchParams(location.search).get("theme") === "dark")
        document.documentElement.classList.add("dark");
    </script>
  </body>
</html>
